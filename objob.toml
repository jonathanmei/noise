# objob per-project configuration.
# Run `objob submit` from anywhere inside this repo to run [slurm].command
# on the obsidian cluster at the current commit.

[remote]
host = "ob"          # ssh alias for the cluster login node (~/.ssh/config)
base_dir = "~/code"  # remote parent dir; main clone lives at base_dir/<repo>
# dir = "~/code/myproj"  # or set the full remote path explicitly
per_branch = true    # each branch runs in its own git worktree at <dir>@<branch>

[slurm]
# Command the job runs, from the project root on the cluster.
command = "uv run torchrun --standalone --nproc_per_node=8 train/val/dust.py --optimizer muon --steps 1000 --eval-every 100 --target-loss 3.5 --data-dir /home/jonathan.mei/data/noise --output logs/obsidian-muon-1000"
partition = "cgpus"   # short (30 min) | cpus / gpus / cgpus (4 h) | notebooks
time = "04:00:00"     # walltime; must fit the partition limit
cpus_per_task = 32
mem = "256G"
nodes = 1
gres = "gpu:h100:8"     # GPU request: a100 | h100 | nvidia_h200
# job_name = "myproj"     # default: repo name
# log_dir = ".objob/logs" # slurm logs, relative to the remote project root
# extra_sbatch = ["#SBATCH --mail-type=END"]
# cluster = "ionqgcp"     # burst to GCP (spends credits); partition must be a10040g1 | a10040g4 | a10040g8
